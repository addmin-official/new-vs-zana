name = "zana-api-worker"
main = "src/worker/index.ts"
compatibility_date = "2026-09-10"

# بەشی ASSETS بۆ فایلە ستاتیکەکان
[assets]
directory = "./dist/client"
binding = "ASSETS"

# گۆڕاوەکانی ژینگە (بەبێ کلیلە نهێنییەکان)
[vars]
AI_PROVIDER = "deepseek"

# KV Namespaces (ئەگەر پێویستت پێیانە)
[[kv_namespaces]]
binding = "LEARNING_RECORDS_KV"
id = "9ff7b6464e6c458b996c5ad1110ed4df"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "your-rate-limit-kv-id-here"