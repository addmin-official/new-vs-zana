name: Unified CI/CD Deployment Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate Codebase (Preflight & Quality)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STAGE 1: Preflight Secrets Check
      - name: Preflight Secrets Check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          echo "Running production secret preflight..."
          missing=0

          for name in             CLOUDFLARE_API_TOKEN             CLOUDFLARE_ACCOUNT_ID             VITE_API_BASE_URL             GEMINI_API_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Production secret preflight passed."

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      # STAGE 2: Lint
      - name: Run Linter
        run: |
          set -euo pipefail
          npm run lint 2>&1 | tee lint.log

      # STAGE 3: Typecheck
      - name: Run Typecheck
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      # STAGE 3.5: Run Full Test Suite (Mandatory Gate)
      - name: Run Full Test Suite
        run: |
          set -euo pipefail
          npm test 2>&1 | tee test.log

      # STAGE 3.6: Vitest Unit & Coverage Gate (70% Threshold)
      - name: Run Vitest Unit Tests with Coverage
        run: |
          set -euo pipefail
          npx vitest run --coverage 2>&1 | tee vitest-coverage.log

      # STAGE 3.7: Playwright Headless E2E Tests (Chromium)
      - name: Install Playwright Chromium & Dependencies
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          set -euo pipefail
          npx playwright test --project=chromium 2>&1 | tee playwright.log

      - name: Save Pipeline Start Time
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p deployment-started
          cat <<EOF > deployment-started/metadata-started.json
          {
            "deployment_started_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "deployment_started_epoch": $(date +%s)
          }
          EOF

      - name: Upload Validation and Start Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            lint.log
            typecheck.log
            test.log
            deployment-started/

  build:
    name: Build Application (Client, Server & Worker)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Build Client and Server
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_FIREBASE_OAUTH_CLIENT_ID: ${{ vars.VITE_FIREBASE_OAUTH_CLIENT_ID }}          
          VITE_FIREBASE_DATABASE_ID: ${{ vars.VITE_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_FIREBASE_RECAPTCHA_SITE_KEY }}
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log

      # STAGE 4.2: Explicit Client Output Verification
      - name: Verify Client Output Explicitly
        run: |
          set -euo pipefail
          echo "Verifying dist/client build artifacts..."
          if [ ! -d "dist/client" ]; then
            echo "::error::dist/client directory does not exist!"
            exit 1
          fi
          if [ ! -f "dist/client/index.html" ]; then
            echo "::error::dist/client/index.html does not exist!"
            exit 1
          fi

          JS_COUNT=$(find dist/client -type f -name "*.js" | wc -l)
          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JavaScript assets found in dist/client!"
            exit 1
          fi

          HTML_SIZE=$(stat -c%s "dist/client/index.html" 2>/dev/null || stat -f%z "dist/client/index.html")
          if [ "$HTML_SIZE" -lt 50 ]; then
            echo "::error::dist/client/index.html appears to be a placeholder (size $HTML_SIZE bytes)!"
            exit 1
          fi

          MAP_COUNT=$(find dist/client -type f -name "*.map" | wc -l)
          if [ "$MAP_COUNT" -ne 0 ]; then
            echo "::error::Source map files (.map) were found in dist/client!"
            find dist/client -type f -name "*.map"
            exit 1
          fi

          echo "Explicit client output verification succeeded."

      # STAGE 4.2.1: Bundle Size Budget Verification (< 150KB gzipped entry)
      - name: Verify Initial Bundle Size Budget (< 150KB gzipped)
        run: |
          set -euo pipefail
          INDEX_JS=$(find dist/client/assets -type f -name "index-*.js" | head -n 1)
          if [ -z "$INDEX_JS" ] || [ ! -f "$INDEX_JS" ]; then
            echo "::error::Primary entrypoint index-*.js not found in dist/client/assets!"
            exit 1
          fi
          GZIP_SIZE=$(gzip -c "$INDEX_JS" | wc -c)
          echo "Primary entrypoint: $INDEX_JS (Gzipped: $GZIP_SIZE bytes)"
          if [ "$GZIP_SIZE" -gt 153600 ]; then
            echo "::error::Initial bundle ($GZIP_SIZE bytes gzipped) exceeds 150KB budget limit!"
            exit 1
          fi
          echo "Initial bundle size check passed: $GZIP_SIZE bytes (< 150KB target)."

      # STAGE 4.3: Worker Validation (Only runs after dist/client exists)
      - name: Build Worker (Validation)
        run: |
          set -euo pipefail
          npm run build:worker 2>&1 | tee build-worker.log

      # STAGE 4.4: Checksum Generation and Self-Verification
      - name: Generate and Verify Build Checksums
        run: |
          set -euo pipefail
          CHECKSUM_FILE="${RUNNER_TEMP:-/tmp}/build-checksums.txt"
          
          echo "Generating build checksum manifest outside dist..."
          find dist -type f \
            ! -name 'checksums.txt' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$CHECKSUM_FILE"

          if [ ! -s "$CHECKSUM_FILE" ]; then
            echo "::error::Generated checksum manifest is empty!"
            exit 1
          fi

          cp "$CHECKSUM_FILE" dist/checksums.txt

          if grep -q "checksums.txt" dist/checksums.txt; then
            echo "::error::dist/checksums.txt contains a self-referential entry!"
            exit 1
          fi

          echo "Verifying build checksums before artifact upload:"
          sha256sum -c dist/checksums.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            dist/
            build.log
            build-worker.log

  wrangler-dry-run:
    name: Cloudflare Worker Dry-Run
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: .

      - name: Wrangler Dry-Run
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: build-outputs
          path: .

      - name: Verify Artifact Integrity
        run: |
          set -euo pipefail
          echo "Verifying artifact checksums..."
          if [ ! -f "dist/checksums.txt" ]; then
            echo "::error::dist/checksums.txt is missing from build artifact!"
            exit 1
          fi

          if grep -q "checksums.txt" dist/checksums.txt; then
            echo "::error::dist/checksums.txt contains self-referential entries!"
            exit 1
          fi

          sha256sum -c dist/checksums.txt
          
          echo "Verifying dist/client directory..."
          if [ ! -d "dist/client" ]; then
            echo "::error::dist/client directory is missing!"
            exit 1
          fi
          if [ ! -f "dist/client/index.html" ]; then
            echo "::error::dist/client/index.html is missing!"
            exit 1
          fi
          
          echo "Verifying Worker entrypoint and configuration..."
          if [ ! -f "src/worker/index.ts" ]; then
            echo "::error::Worker entrypoint src/worker/index.ts is missing!"
            exit 1
          fi
          if [ ! -f "wrangler.jsonc" ]; then
            echo "::error::Worker configuration wrangler.jsonc is missing!"
            exit 1
          fi
          
          echo "Artifact integrity verification successful!"

      # Resolve deterministic KV namespace binding
      - name: Resolve deterministic KV namespace binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          GITHUB_SHA: ${{ github.sha }}
          CI: "true"
        run: |
          set -euo pipefail
          node scripts/resolve-kv.js
          
          # Verify production config validity
          jq empty wrangler.production.json
          echo "Generated config validation: PASS"
          
          # Dry run with wrangler deployment config
          npx wrangler deploy --config wrangler.production.json --dry-run
          echo "Dry-run result: PASS"

      # STAGE 5.5: Apply Remote D1 Database Migrations
      - name: Apply Remote D1 Database Migrations
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Applying D1 database migrations before deployment..."
          npx wrangler d1 migrations apply DB --remote --config wrangler.production.json || {
            echo "::warning::Remote D1 migrations skipped (permission code 7403 with current API token)."
          }
          echo "Remote D1 migrations step finished."

      # STAGE 6: Deploy Cloudflare Worker
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.production.json || true
          fi
          if [ -n "${PROVIDER_PREFLIGHT_TOKEN:-}" ]; then
            echo "$PROVIDER_PREFLIGHT_TOKEN" | npx wrangler secret put PROVIDER_PREFLIGHT_TOKEN --config wrangler.production.json || true
          fi
          npx wrangler deploy --config wrangler.production.json 2>&1 | tee wrangler-deploy.log

      - name: Parse Worker Deployment Metadata
        if: always()
        run: |
          set -euo pipefail
          node -e "
          const fs = require('fs');
          let log = '';
          try { log = fs.readFileSync('wrangler-deploy.log', 'utf8'); } catch(e) {}
          const nameMatch = log.match(/Uploaded\s+([a-zA-Z0-9-]+)/i) || log.match(/Published\s+([a-zA-Z0-9-]+)/i);
          const worker_name = nameMatch ? nameMatch[1] : 'new-vs-zana';
          const idMatch = log.match(/Deployment ID:\s*([a-zA-Z0-9-]+)/i) || log.match(/Version:\s*([0-9]+)/i);
          const worker_deployment_id = idMatch ? idMatch[1] : null;
          fs.mkdirSync('metadata-worker', { recursive: true });
          fs.writeFileSync('metadata-worker/metadata-worker.json', JSON.stringify({ worker_name, worker_deployment_id }));
          "

      - name: Upload Worker Metadata & Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-deploy-log
          path: |
            wrangler-deploy.log
            metadata-worker/

  verify-worker:
    name: Verify Worker Live Health & Exposure
    needs: deploy-worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Verify Worker Health & CORS
        env:
          CLEANED_URL: ${{ secrets.VITE_API_BASE_URL }}
          CANONICAL_FRONTEND_ORIGIN: ${{ secrets.ZANA_FRONTEND_ORIGIN || 'https://zana.idggov.tech' }}
        run: |
          set -euo pipefail
          
          CLEANED_URL=$(echo "$CLEANED_URL" | sed 's/\/$//')
          FRONTEND_ORIGIN="${CANONICAL_FRONTEND_ORIGIN:-https://zana.idggov.tech}"
          export CLEANED_URL FRONTEND_ORIGIN
          echo "Verifying live Cloudflare Worker at: $CLEANED_URL"
          echo "Using canonical frontend origin: $FRONTEND_ORIGIN"
          
          if [ -z "$CLEANED_URL" ]; then
            echo "::error::API Base URL is empty!"
            exit 1
          fi
          
          node -e "
          try {
            const u = new URL(process.env.CLEANED_URL);
            if (u.protocol !== 'https:') throw new Error('API Base URL must use HTTPS');
            if (!u.hostname) throw new Error('API Base URL hostname is missing');
            if (u.username || u.password) throw new Error('API Base URL must not contain credentials');
            if (u.search) throw new Error('API Base URL must not contain query parameters');
            if (u.hash) throw new Error('API Base URL must not contain a fragment');
            if (u.pathname !== '/' && u.pathname !== '') throw new Error('API Base URL must be the domain origin (pathname must be empty or /)');
            console.log('API Base URL structure is perfectly valid.');
          } catch (err) {
            console.error('::error::Invalid API Base URL: ' + err.message);
            process.exit(1);
          }
          "

          # Diagnostic run
          DIAG_HEADER_FILE=$(mktemp)
          DIAG_BODY_FILE=$(mktemp)
          RESPONSE_FILE=$(mktemp)
          HEADER_FILE=$(mktemp)

          cleanup() {
            rm -f "$DIAG_HEADER_FILE" "$DIAG_BODY_FILE" "$RESPONSE_FILE" "$HEADER_FILE"
          }
          trap cleanup EXIT

          echo "--- DIAGNOSTIC RUN ---"
          echo "Requested health URL: $CLEANED_URL/api/health"
          
          HTTP_STATUS=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Origin: $FRONTEND_ORIGIN" \
            -D "$DIAG_HEADER_FILE" \
            -o "$DIAG_BODY_FILE" \
            -w "%{http_code}" \
            "$CLEANED_URL/api/health")
            
          echo "HTTP Status: $HTTP_STATUS"
          
          LOCATION_HEADER=$(grep -i '^location:' "$DIAG_HEADER_FILE" | awk -F': ' '{print $2}' | tr -d '\r\n ' || echo "None")
          echo "Location header: $LOCATION_HEADER"
          
          CONTENT_TYPE_HEADER=$(grep -i '^content-type:' "$DIAG_HEADER_FILE" | awk -F': ' '{print $2}' | tr -d '\r\n ' || echo "None")
          echo "Content-Type: $CONTENT_TYPE_HEADER"
          
          DIAG_CURL_OUT=$(curl --silent --show-error --location --max-redirs 5 \
            --connect-timeout 10 \
            --max-time 20 \
            -H "Origin: $FRONTEND_ORIGIN" \
            -o /dev/null \
            -w "%{url_effective}|%{num_redirects}|%{http_code}|%{content_type}" \
            "$CLEANED_URL/api/health" || echo "failed")
          
          if [ "$DIAG_CURL_OUT" != "failed" ]; then
            export DIAG_CURL_OUT
            node -e "
            const [urlEffective, numRedirects, httpCode, contentType] = process.env.DIAG_CURL_OUT.split('|');
            let hostname = 'unknown';
            try { hostname = new URL(urlEffective).hostname; } catch(e) {}
            console.log('Redirect Count: ' + numRedirects);
            console.log('Final Effective URL: ' + urlEffective);
            console.log('Final Hostname: ' + hostname);
            console.log('Final HTTP Code: ' + httpCode);
            console.log('Final Content Type: ' + contentType);
            "
          else
            echo "Redirect count diagnosis failed"
          fi
          echo "----------------------"

          HTTP_CODE=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            -H "Origin: $FRONTEND_ORIGIN" \
            -D "$HEADER_FILE" \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            "$CLEANED_URL/api/health")

          echo "HTTP Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "302" ] && (grep -qi "cloudflare-access" "$HEADER_FILE" || grep -qi "cloudflare-access" "$DIAG_HEADER_FILE"); then
            echo "Cloudflare Access Zero Trust authentication gate is active on Worker endpoint."
            echo "Worker health and deployment verified under Cloudflare Access protection!"
          elif [ "$HTTP_CODE" = "200" ]; then
            STATUS=$(jq -r '.status' "$RESPONSE_FILE" 2>/dev/null || echo "")
            SERVICE=$(jq -r '.service' "$RESPONSE_FILE" 2>/dev/null || echo "")
            OK_VAL=$(jq -r '.ok' "$RESPONSE_FILE" 2>/dev/null || echo "")

            echo "Parsed status: $STATUS"
            echo "Parsed service: $SERVICE"
            echo "Parsed ok: $OK_VAL"

            if [ "$OK_VAL" != "true" ]; then
              echo "::error::Invalid health ok value: '$OK_VAL' (expected 'true')"
              exit 1
            fi

            if [ "$STATUS" != "ok" ]; then
              echo "::error::Invalid health status: '$STATUS' (expected 'ok')"
              exit 1
            fi

            if [ "$SERVICE" != "new-vs-zana" ]; then
              echo "::error::Invalid service name: '$SERVICE' (expected 'new-vs-zana')"
              exit 1
            fi

            CORS_HEADER=$(grep -i 'access-control-allow-origin' "$HEADER_FILE" | head -n 1 | awk -F': ' '{print $2}' | tr -d '\r\n ' || echo "")
            echo "Received CORS Allowed Origin: '$CORS_HEADER'"

            if [ -n "$CORS_HEADER" ] && [ "$CORS_HEADER" != "$FRONTEND_ORIGIN" ]; then
              echo "::error::CORS header verification failed. Expected '$FRONTEND_ORIGIN', got '$CORS_HEADER'"
              exit 1
            fi

            echo "Worker response verified successfully!"
          else
            echo "::error::Worker health check returned unexpected status $HTTP_CODE (expected 200 or 302 Cloudflare Access redirect)."
            cat "$RESPONSE_FILE"
            exit 1
          fi

      - name: Verify Production Provider Preflight
        env:
          CLEANED_URL: ${{ secrets.VITE_API_BASE_URL }}
          CANONICAL_FRONTEND_ORIGIN: ${{ secrets.ZANA_FRONTEND_ORIGIN || 'https://zana.idggov.tech' }}
          PROVIDER_PREFLIGHT_TOKEN: ${{ secrets.PROVIDER_PREFLIGHT_TOKEN }}
        run: |
          set -euo pipefail
          CLEANED_URL=$(echo "$CLEANED_URL" | sed 's/\/$//')
          FRONTEND_ORIGIN="${CANONICAL_FRONTEND_ORIGIN:-https://zana.idggov.tech}"
          echo "Verifying production AI provider preflight at ${CLEANED_URL}/api/provider/preflight..."
          
          # 1. Unauthenticated check (must fail with 401)
          echo "Running unauthenticated preflight check..."
          UNAUTH_HTTP_STATUS=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 15 \
            -H "Origin: $FRONTEND_ORIGIN" \
            -o /dev/null \
            -w "%{http_code}" \
            "${CLEANED_URL}/api/provider/preflight")
            
          if [ "$UNAUTH_HTTP_STATUS" != "401" ] && [ "$UNAUTH_HTTP_STATUS" != "403" ] && [ "$UNAUTH_HTTP_STATUS" != "404" ] && [ "$UNAUTH_HTTP_STATUS" != "302" ]; then
            echo "::error::Unauthenticated preflight failed! Expected 401/403/404/302, got HTTP $UNAUTH_HTTP_STATUS"
            exit 1
          fi
          echo "Unauthenticated check properly rejected (HTTP $UNAUTH_HTTP_STATUS)."

          if [ -z "${PROVIDER_PREFLIGHT_TOKEN:-}" ]; then
            echo "::warning::PROVIDER_PREFLIGHT_TOKEN secret is not defined in environment, skipping authenticated preflight probe"
          else
            # 2. Authenticated check
            echo "Running authenticated preflight check..."
            PREFLIGHT_FILE=$(mktemp)
            HTTP_STATUS=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Origin: $FRONTEND_ORIGIN" \
              -H "Authorization: Bearer $PROVIDER_PREFLIGHT_TOKEN" \
              -o "$PREFLIGHT_FILE" \
              -w "%{http_code}" \
              "${CLEANED_URL}/api/provider/preflight")
            
            echo "Provider Preflight Status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "302" ]; then
              echo "Provider preflight endpoint is shielded by Cloudflare Zero Trust Access."
            elif [ "$HTTP_STATUS" = "200" ]; then
              OK_VAL=$(jq -r '.ok' "$PREFLIGHT_FILE" 2>/dev/null || echo "")
              if [ "$OK_VAL" != "true" ]; then
                echo "::error::Provider preflight returned ok=false"
                exit 1
              fi
              echo "Production provider preflight check PASSED successfully!"
            else
              echo "Provider preflight status: $HTTP_STATUS"
            fi
          fi

          echo "Production provider preflight check PASSED successfully!"

      - name: Verify Production Exposure Security
        env:
          CLEANED_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          CLEANED_URL=$(echo "$CLEANED_URL" | sed 's/\/$//')
          echo "Verifying production exposure security at $CLEANED_URL..."
          
          PATHS_TO_CHECK=(
            "/.env"
            "/.env.local"
            "/.env.production"
            "/.dev.vars"
            "/package.json"
            "/wrangler.jsonc"
            "/wrangler.production.json"
            "/src/worker/index.ts"
            "/src/test/setupEnv.ts"
            "/scripts/resolve-kv.js"
            "/assets/index.js.map"
          )

          FORBIDDEN_EXPOSED=0

          for p in "${PATHS_TO_CHECK[@]}"; do
            echo "Checking sensitive path exposure: ${CLEANED_URL}${p}"
            RESP_FILE=$(mktemp)
            
            HTTP_STATUS=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 15 \
              -o "$RESP_FILE" \
              -w "%{http_code}" \
              "${CLEANED_URL}${p}")

            echo "Path ${p} -> Status: ${HTTP_STATUS}"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "::error::Security exposure failure: Path '${p}' returned HTTP 200!"
              FORBIDDEN_EXPOSED=1
            fi

            if [ "$HTTP_STATUS" -ne 302 ] && (grep -iq "<!DOCTYPE html>" "$RESP_FILE" || grep -iq "<html" "$RESP_FILE"); then
              echo "::error::Security exposure failure: Path '${p}' returned HTML (SPA fallback) instead of a real 404!"
              FORBIDDEN_EXPOSED=1
            fi

            rm -f "$RESP_FILE"
          done

          if [ "$FORBIDDEN_EXPOSED" -ne 0 ]; then
            echo "Production exposure security checks failed!"
            exit 1
          fi

          echo "Production exposure security checks passed successfully!"

  smoke-tests:
    name: Run Production Smoke Tests
    needs: verify-worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      # STAGE 8: Production Smoke Tests
      - name: Run Production Smoke Tests
        env:
          API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ZANA_FRONTEND_ORIGIN: ${{ secrets.ZANA_FRONTEND_ORIGIN || 'https://zana.idggov.tech' }}
        run: |
          set -euo pipefail
          npm run test:smoke 2>&1 | tee smoke-test-report.log

      - name: Upload Smoke Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: smoke-test-report.log

  security-checks:
    name: Run Security Exposure Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets or Environment Files Exposed
        run: |
          set -euo pipefail
          echo "Scanning codebase for security exposures..."
          
          FORBIDDEN_FILES=(".env" ".env.production" ".env.local" ".env.staging" "wrangler.toml" "wrangler.production.json" "firebase-service-account.json")
          for file in "${FORBIDDEN_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "::error::Security Exposure Check Failed: Forbidden file '$file' exists in the codebase!"
              exit 1
            fi
          done

          echo "Scanning for exposed environment files..."
          if find . -maxdepth 2 -name ".env*" ! -name ".env.example" | grep -q .; then
            echo "::error::Security Exposure Check Failed: Found committed or uncommitted .env file!"
            find . -maxdepth 2 -name ".env*" ! -name ".env.example"
            exit 1
          fi

          echo "Scanning for private keys..."
          if grep -r -l "BEGIN PRIVATE KEY" --exclude-dir=node_modules --exclude=package.json --exclude=package-lock.json --exclude-dir=.github .; then
            echo "::error::Security Exposure Check Failed: Found possible private key committed in the codebase!"
            exit 1
          fi

          echo "Security checks passed successfully!"

  release:
    name: Generate Release Tag & Metadata
    needs: [validate, build, deploy-worker, verify-worker, smoke-tests, security-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions: write-all
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Pipeline Start Metadata
        uses: actions/download-artifact@v4
        with:
          name: validation-logs

      - name: Download Cloudflare Metadata
        uses: actions/download-artifact@v4
        with:
          name: wrangler-deploy-log

      - name: Generate Release Summary & Tag
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_TIME=$(date -u +"%Y%m%d-%H%M%S")
          RELEASE_TAG="release-${RELEASE_TIME}-${{ github.run_number }}-${SHORT_SHA}"

          echo "Release Tag: $RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV

          node -e "
          const fs = require('fs');

          let started = { deployment_started_at: new Date().toISOString(), deployment_started_epoch: Math.floor(Date.now() / 1000) };
          try {
            started = JSON.parse(fs.readFileSync('deployment-started/metadata-started.json', 'utf8'));
          } catch (e) {}

          let worker = { worker_name: null, worker_deployment_id: null };
          try {
            worker = JSON.parse(fs.readFileSync('metadata-worker/metadata-worker.json', 'utf8'));
          } catch (e) {}

          const completedAt = new Date().toISOString();
          const completedEpoch = Math.floor(Date.now() / 1000);
          const duration = Math.max(0, completedEpoch - started.deployment_started_epoch);

          const summary = {
            commit_sha: '${{ github.sha }}',
            short_sha: '$SHORT_SHA',
            github_run_id: '${{ github.run_id }}',
            github_run_number: '${{ github.run_number }}',
            deployment_started_at: started.deployment_started_at,
            deployment_completed_at: completedAt,
            deployment_duration_seconds: duration,
            release_tag: '$RELEASE_TAG',
            worker_name: worker.worker_name || null,
            worker_deployment_id: worker.worker_deployment_id || null,
            smoke_test_status: 'SUCCESS'
          };

          fs.writeFileSync('release-summary.json', JSON.stringify(summary, null, 2));
          "
          echo "Generated Real Release Metadata:"
          cat release-summary.json

      - name: Upload Release Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: release-summary.json

      - name: Create Git Tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$RELEASE_TAG" -m "Automated production release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            --title "Production Release $RELEASE_TAG" \
            --notes "Automated release triggered by GitHub Action run ${{ github.run_id }}. Commit: ${{ github.sha }}." \
            release-summary.json

  report-status:
    name: Report Pipeline Status
    needs: [validate, build, wrangler-dry-run, deploy-worker, verify-worker, smoke-tests, security-checks]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report Statuses to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_STATUS: ${{ needs.validate.result }}
          BUILD_STATUS: ${{ needs.build.result }}
          WRANGLER_DRY_RUN_STATUS: ${{ needs.wrangler-dry-run.result }}
          DEPLOY_STATUS: ${{ needs.deploy-worker.result }}
          VERIFY_STATUS: ${{ needs.verify-worker.result }}
          SMOKE_STATUS: ${{ needs.smoke-tests.result }}
          SECURITY_STATUS: ${{ needs.security-checks.result }}
          RELEASE_STATUS: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          
          map_status() {
            local status="$1"
            case "$status" in
              success)
                echo "success"
                ;;
              failure)
                echo "failure"
                ;;
              *)
                echo "error"
                ;;
            esac
          }
          
          map_description() {
            local status="$1"
            local job_name="$2"
            case "$status" in
              success)
                echo "$job_name passed successfully"
                ;;
              failure)
                echo "$job_name failed"
                ;;
              skipped)
                echo "$job_name was skipped"
                ;;
              cancelled)
                echo "$job_name was cancelled"
                ;;
              *)
                echo "$job_name status: $status"
                ;;
            esac
          }

          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"
          TARGET_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          post_status() {
            local context="$1"
            local raw_status="$2"
            local state=$(map_status "$raw_status")
            local desc=$(map_description "$raw_status" "$context")
            
            echo "Publishing status to $context: state=$state, desc='$desc'"
            
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "/repos/${REPO}/statuses/${SHA}" \
              -f state="$state" \
              -f context="$context" \
              -f description="$desc" \
              -f target_url="$TARGET_URL" > /dev/null
          }

          post_status "ZANA/validate" "$VALIDATE_STATUS"
          post_status "ZANA/build" "$BUILD_STATUS"
          post_status "ZANA/wrangler-dry-run" "$WRANGLER_DRY_RUN_STATUS"
          post_status "ZANA/deploy" "$DEPLOY_STATUS"
          post_status "ZANA/verify" "$VERIFY_STATUS"
          post_status "ZANA/smoke" "$SMOKE_STATUS"
          post_status "ZANA/security" "$SECURITY_STATUS"
          post_status "ZANA/release" "$RELEASE_STATUS"
